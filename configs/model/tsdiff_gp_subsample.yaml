# @package _global_
# DSPD-GP (tsdiff, Bilos et al. ICML 2023) baseline: same SLiCE backbone and
# conditioning as slice_subsample.yaml; only the generative core differs.
# diffusion_params selects TSDiffCond in bin/train_model.py:create_model.
model: conditional
setting: univariate
model_params:
  backbone_params:
    input_dim: 1
    output_dim: 1
    step_emb: 64
    bidirectional: false
    num_residual_blocks: 3
    residual_block: slice
    slice_block_params:
      block_size: 1
      diagonal_dense: false
      bound_norm: true
    hidden_dim: 16
    dropout: 0.0
    init_skip: false        # required for a clean epsilon-prediction head
    feature_skip: true
  num_steps: 100            # reinterpreted: DSPD diffusion steps N
  solver: ancestral         # reinterpreted: ancestral sampler (euler -> ancestral + warning)
  device: cuda:0
  optimizer_params:
    lr: 0.001
    weight_decay: 0.0
  ema_params:
    beta: 0.9999
    update_after_step: 128
    update_every: 1
  gp_time_mode: continuous
  matching: random          # ignored by TSDiffCond
  use_ema: true
  use_lags: true
  diffusion_params:
    family: discrete
    noise: gp
    gp_sigma: null          # null -> 1/sqrt(prior gamma), in hours
    beta_start: 1.0e-4
    beta_end: 0.2           # upstream convention: 20 / num_steps
    predict_gaussian_noise: true
    noise_around: zero      # published tsdiff behavior; gp_mean = TSFlow-anchored ablation
    time_normalization: physical  # kernel hyperparameters in physical hours; span = upstream-parity ablation
    loss_mask_unobserved: true
    denoiser: tsdiff_rnn    # upstream RNN denoiser (their backbone); gslices = shared-SLiCE ablation
    denoiser_params:
      hidden_dim: 128       # upstream synthetic defaults
      num_layers: 2
      bidirectional: true
