# @package _global_
model: conditional
setting: univariate
model_params:
  backbone_params:
    input_dim: 1
    output_dim: 1
    step_emb: 64
    residual_to_gp_mean: true
    bidirectional: false
    num_residual_blocks: 3
    residual_block: slice
    slice_block_params:
      block_size: 1
      diagonal_dense: false
      bound_norm: true
    hidden_dim: 128
    dropout: 0.0
    init_skip: false
    feature_skip: true
  num_samples: 16
  num_steps: 32
  solver: euler
  device: cuda:0
  matching: random
  use_lags: true
