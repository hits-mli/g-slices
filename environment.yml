name: cde-forecast-matching
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.13
  - pip>=24

  # Core scientific stack used directly by training, evaluation, and plotting.
  - numpy>=2.0,<3
  - pandas>=2.2,<3
  - scipy>=1.15,<2
  - scikit-learn>=1.6,<2
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<0.14
  - tqdm>=4.66,<5
  - pyyaml>=6,<7

  # Experiment configuration and logging.
  - hydra-core>=1.3,<1.4
  - aim>=3.20,<4

  # PyTorch GPU stack. Keep Torch below 2.7 so pip dependencies cannot upgrade it
  # to CUDA 13 wheels, which require newer drivers than the Genoa GPU nodes.
  - pytorch>=2.5,<2.7
  - pytorch-cuda=12.4
  - lightning>=2.5,<3
  - pytorch-lightning>=2.5,<3

  # Time-series modelling and TSFlow dependencies imported by the codebase.
  - gluonts>=0.16,<0.17
  - einops>=0.8,<1
  - ema_pytorch>=0.7,<1
  - opt_einsum>=3.4,<4
  - pot>=0.9,<1

  # Development and notebooks
  - pytest>=9,<10
  # - jupyter>=1.1,<2
  # - ipykernel>=7,<8

  - pip:
      - torch>=2.5,<2.7
      - linear-attention-transformer>=0.19,<0.20
      - pykeops>=2.3,<3
      - torchcde>=0.2,<0.3
      - torchdyn>=1.0,<2
      - torchtyping>=0.1,<0.2
