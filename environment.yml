name: cde-forecast-matching
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.13
  - pip>=24

  # Core scientific stack used directly by training, evaluation, and plotting.
  - numpy>=2.0,<3
  - pandas>=2.2,<3
  - scipy>=1.15,<2
  - scikit-learn>=1.6,<2
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<0.14
  - tqdm>=4.66,<5
  - pyyaml>=6,<7

  # Experiment configuration and logging.
  - hydra-core>=1.3,<1.4
  - aim>=3.20,<4

  # Lightning comes from conda-forge; Torch itself is installed via pip below
  # (the conda pytorch channel stopped publishing builds after 2.5).
  - lightning>=2.5,<3
  - pytorch-lightning>=2.5,<3

  # Time-series modelling and TSFlow dependencies imported by the codebase.
  - gluonts>=0.16,<0.17
  - einops>=0.8,<1
  - ema_pytorch>=0.7,<1
  - opt_einsum>=3.4,<4
  - pot>=0.9,<1

  # Development and notebooks
  - pytest>=9,<10
  # - jupyter>=1.1,<2
  # - ipykernel>=7,<8

  - pip:
      # CUDA 12.6 wheels: the pinned index keeps pip off CUDA-13 wheels, which
      # need newer drivers than the Genoa GPU nodes. Torch 2.9 + cu126 is
      # validated end-to-end on the cluster (training, GP prior, evaluation).
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch>=2.9,<3.0
      - linear-attention-transformer>=0.19,<0.20
      - pykeops>=2.3,<3
      - torchcde>=0.2,<0.3
      - torchdyn>=1.0,<2
      - torchtyping>=0.1,<0.2
